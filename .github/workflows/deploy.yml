name: Deploy Astro site to GitHub Pages

# NOTE: This workflow publishes the built Astro site to GitHub Pages via the
# official Pages deployment action. It only takes effect once the repository's
# Pages "Build and deployment > Source" is switched from "Deploy from a branch"
# (legacy) to "GitHub Actions". Until that switch is made, the live site keeps
# serving the existing setup and this workflow's deploy step is a no-op surface.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

# The standard actions/* below are already on their latest majors; they still
# run Node 20 internally. Opt into Node 24 now (GitHub's recommended fix) to
# clear the deprecation warning until those actions ship Node 24 versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # Use `npm install`, not `npm ci`: sharp (via Astro image optimisation)
        # pulls platform-specific optional deps, and a lockfile generated on
        # Windows omits the Linux wasm @emnapi/* package entries, which makes the
        # strict `npm ci` fail ("Missing @emnapi/runtime from lock file") on the
        # Linux runner. `npm install` reconciles and installs the correct native
        # sharp for the runner.
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
